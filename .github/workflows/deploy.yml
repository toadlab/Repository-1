name: Refresh news & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */3 * * *" # every 3 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Carry the rolling news archive forward from the live site so the
      # weekly and monthly views keep ~35 days of headlines between runs.
      - name: Restore previous news archive
        run: |
          if curl -fsSL "${{ steps.pages.outputs.base_url }}/data/news.json" -o /tmp/news.json; then
            mv /tmp/news.json data/news.json
            echo "Restored archive"
          else
            echo "No previous archive; starting from the committed snapshot"
          fi

      - name: Fetch feeds
        run: python scripts/fetch_news.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
