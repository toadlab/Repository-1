name: Digest pipeline & deploy

# Hourly: fetch feeds, score new stories, build the day's digest once it's due
# (or break the rhythm for an emergency), commit the pipeline state, and deploy.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Full article text for the stage-2 review is cached by URL between runs.
      # It lives outside the repo so it is never committed or published.
      - name: Restore article cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/news-digest/articles
          key: articles-${{ github.run_id }}
          restore-keys: articles-

      - name: Fetch feeds
        run: python scripts/fetch_news.py

      - name: Score new stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/score.py

      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_digest.py

      # Today's ESV text, fetched once a day with a secret key so the key never reaches browsers.
      # Written to esv/today.json, which is published with the site but never committed.
      - name: Fetch today's ESV text
        env:
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
          # Reuse today's text from the live site, so ESV is asked only once a day.
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/esv_today.js

      - name: Commit pipeline state
        id: commit
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "Update digest data [skip ci]"
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    # Hourly runs that changed nothing don't need a redeploy.
    if: needs.build.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
